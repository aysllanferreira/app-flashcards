schema: spec-driven

context: |
  Project: app-flashcards, a flashcards application. Planned stack: a Turborepo
  monorepo with pnpm workspaces, a Next.js web app (apps/web) and a NestJS API
  (apps/api), tracked in GitHub issue #1.
  GitHub repo: aysllanferreira/app-flashcards, accessed with the gh CLI.

  Workflow: GitHub issues are the single source of truth. Every OpenSpec change
  is linked to one open issue that has exactly three sections, Motivation,
  Description and Acceptance Criteria, with verifiable checkbox criteria.
  Creating or editing issue text needs user approval. Ticking verified criteria
  and posting progress comments are automatic. The full rules are in the
  "Issue-driven workflow" section of CLAUDE.md at the repo root, and they take
  precedence over this file. A large change may instead ship as a parent issue
  with sub-issues delivered through an integration branch, when the user
  chooses it (see "Sub-issues and integration branches" in CLAUDE.md).

  System design: system-design/ (PNG diagrams, their .excalidraw sources and
  README.md) is the source of truth for architecture, flows, data model and
  CI/CD. Every phase checks work against it, and a change that diverges must
  either be adjusted or update the diagrams after user approval. The full rules
  are in the "System design" section of CLAUDE.md.

  API (apps/api): NestJS feature modules in src/modules/<name>/, Zod schemas in
  dto/ validated and serialized through Nest's built-in Standard Schema support,
  and a generated OpenAPI 3.1 contract committed as apps/api/openapi.json that
  is the source of truth for the API. The full rules are in the "API (apps/api)"
  section of CLAUDE.md.

  Database: Postgres 18 in Docker locally (compose.yaml), Neon in production.
  Drizzle tables live in each module's schema/ folder, and SQL migrations are
  generated with drizzle-kit and committed. The table conventions, migration
  rules and database tests are in the "Database" subsection of CLAUDE.md.

  Git: Conventional Commits, authored only by the repo owner, with no Claude
  Co-Authored-By trailer or "Generated with Claude Code" line. dev is the
  default branch and every feature PR targets it. Feature PRs are squash-merged
  only, and the squash commit title is the PR title plus "(#N)". main is the
  release branch: release PRs dev -> main are merged with a merge commit.
  Versions are per-app git tags (<app>@X.Y.Z-dev.N on dev, <app>@X.Y.Z on main).
  See "Commits and pull requests" in CLAUDE.md.

rules:
  proposal:
    - 'The first line of proposal.md is exactly "Issue: #N", where N is the linked open GitHub issue. Do not write the proposal without one (see CLAUDE.md, Propose).'
    - 'The proposal must not claim scope or acceptance outcomes that the linked issue does not contain. If the issue needs to change, propose the issue edit to the user first.'
    - 'State the system design alignment after checking system-design/ (README.md and the relevant diagrams): write "System design: no change", or list each diagram to add or update and what changes in it (see CLAUDE.md, System design).'
    - 'When the change ships as sub-issues, line 1 is "Issue: #P" (the parent issue) and line 2 is "Sub-issues: #S1, #S2, ..." listing every sub-issue in delivery order (see CLAUDE.md, Sub-issues and integration branches).'
    - 'State the API contract impact: write "API contract: no change", or list each apps/api endpoint (method and path) the change adds, changes or removes (see CLAUDE.md, API (apps/api)).'
    - 'For every endpoint listed under the API contract impact, state whether it is public or authenticated. Routes need a Clerk session token unless marked @Public(), which is only for health, docs and signed callbacks such as webhooks (see CLAUDE.md, API (apps/api), Auth).'
    - 'State the data model impact: write "Data model: no change", or list the tables and columns the change adds, changes or removes (see CLAUDE.md, Database).'
  design:
    - 'Do not describe architecture, flows, data model or CI/CD that contradict system-design/ unless proposal.md lists the matching diagram updates.'
    - 'API request and response shapes are Zod schemas in the module''s dto/ folder (body and response schemas with .meta({ id }), query and path-parameter schemas without one). Never design class-validator or class-transformer DTOs, or use nestjs-zod (see CLAUDE.md, API (apps/api)).'
    - 'New or changed tables follow the table conventions in CLAUDE.md (Database): UUIDv7 id(), userId() ownership, composite foreign keys (x_id, user_id) for required references to user-owned rows, NO ACTION for "in use" references, timestamptz, text with CHECK for enumerations, explicit snake_case constraint names. Tables live only in src/modules/<name>/schema/.'
  tasks:
    - 'Every acceptance criterion of the linked issue is covered by at least one task.'
    - 'Each task group heading names the issue acceptance criteria it covers, for example "(issue #N, AC 1 and 2)".'
    - 'When proposal.md lists system-design diagram updates, include tasks to edit or create each NN-name scene in the Excalidraw+ collection app-flashcards through the Excalidraw+ MCP (checked with take_screenshot), export NN-name.excalidraw and NN-name.png from that scene, and update system-design/README.md. Never hand-edit or locally render the diagram files.'
    - 'The last task creates or updates the GitHub Wiki, after the commits and the PR: always Status and Changelog, plus Roadmap, Architecture and Decisions when the change affects them; name the pages it updates (see CLAUDE.md, GitHub Wiki).'
    - 'When the change adds or changes apps/api endpoints, include tasks to: declare their Zod request and response schemas and Swagger decorators (@ApiTags, @ApiOperation, @ApiResponseSchema, @ApiErrorResponses); regenerate apps/api/openapi.json with pnpm --filter api openapi; and add e2e tests that parse each response with its schema (see CLAUDE.md, API (apps/api)).'
    - 'When the change adds or changes database tables or columns, include tasks to: generate the migration with pnpm --filter api db:generate, review and commit the SQL; apply it to a fresh database (docker compose down -v && docker compose up -d --wait db && pnpm --filter api db:migrate) and check db:generate then reports no schema changes; and add database tests in apps/api/test/db for every new constraint (see CLAUDE.md, Database).'
    - 'When the change ships as sub-issues: write one task group per sub-issue in delivery order, its heading naming that sub-issue''s criteria (for example "(issue #S1, AC 1 and 2)"). End each group with tasks that push the sub-branch, open a PR into the integration branch with "Refs #S" (no Closes), post a progress comment on the sub-issue, and stop until the user confirms the merge (gh pr view <n> --json state shows MERGED). Add a final group that opens the PR from the integration branch into dev with "Closes #P" and "Closes #S" for every sub-issue, followed by the wiki task.'

operations:
  apply:
    guidance:
      - 'Before implementing, read the linked issue (N from line 1 of proposal.md) with gh. The issue wins over the change artifacts; report any conflict before continuing.'
      - 'If the scope or an acceptance criterion must change, stop. Propose the issue edit to the user, apply it only after approval, update the artifacts to match, then resume.'
      - 'Tick each acceptance criterion checkbox on the issue as soon as it is verified (command run or behavior observed), without asking. Fetch the body fresh and change only that line.'
      - 'When the apply session finishes or pauses, post a progress comment on the issue (criteria verified, tasks completed, what remains) without asking.'
      - 'For a change shipped as sub-issues: before each task group, read the parent issue and that group''s sub-issue; tick each criterion on the issue that holds it. After opening a sub-PR, post the progress comment on the sub-issue and stop until the user confirms the merge; then cut the next sub-branch from the updated integration branch. When dev moves, merge dev into the integration branch, never rebase it.'
  archive:
    guidance:
      - 'Do not archive while any acceptance criterion on the linked issue is unticked; list the open criteria and stop.'
      - 'For a change shipped as sub-issues: do not archive while any criterion on the parent or on any sub-issue is unticked; list them and stop. Post the summary comment on the parent, and commit the archive on the integration branch (the head of the final PR into dev) before that PR merges.'
      - 'Do not archive while system-design/ does not reflect what the change delivered; list any outstanding diagram updates from proposal.md and stop.'
      - 'Do not archive while the change''s GitHub Wiki task (the last task in tasks.md) is unticked; report it and stop.'
      - 'After archiving, post a summary comment on the issue covering what shipped and the archive path, listing the system-design files that changed (or stating that none did), and linking the wiki pages that changed.'
      - 'Do not close the issue. The PR''s "Closes #N" closes it when the PR is squash-merged into dev, the default branch. If the change reached dev without a PR, ask the user before closing.'
      - 'The delivering PR targets dev (never main, the release branch), has a Conventional Commit title, is squash-merged so the commit title ends in (#N), and carries no Claude co-author or "Generated with Claude Code" line.'
