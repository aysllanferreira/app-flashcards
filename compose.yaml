# Local Postgres for development and tests. Start it with
# `docker compose up -d --wait db`; `docker compose down -v` wipes the data.
# The credentials are for this machine only (the port is bound to 127.0.0.1).
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: flashcards
      POSTGRES_PASSWORD: flashcards
      POSTGRES_DB: flashcards
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data in a versioned folder under this path.
      - pgdata:/var/lib/postgresql
      # Runs only when the volume is empty.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcards -d flashcards"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
